spring:
  application:
    name: arcadia-premium

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:arcadia_premium}
    username: ${DB_USER:arcadia}
    password: ${DB_PASS:arcadia123}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000       # 30s to wait for a connection from pool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000             # 5 min idle before connection is removed
      max-lifetime: 600000             # 10 min max connection lifetime
      keepalive-time: 300000           # 5 min keepalive ping to prevent stale connections
      validation-timeout: 5000        # 5s to validate a connection

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

  # Email configuration — Gmail SMTP
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:garimella.srinivasu@gmail.com}
    password: ${MAIL_PASSWORD:tpcsdzpyqnotslvn}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enabled: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
        from: ${MAIL_FROM:garimella.srinivasu@gmail.com}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      file-size-threshold: 1MB

server:
  address: 0.0.0.0
  port: ${PORT:8080}
  tomcat:
    connection-timeout: 300000
    max-swallow-size: 100MB
  servlet:
    session:
      timeout: 30m

app:
  cors:
    # Local: defaults to * (all origins) for LAN access
    # Production: set CORS_ALLOWED_ORIGINS env var to your Netlify domain
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  spa:
    # Set to true only when serving frontend from Spring Boot (local single-server mode)
    # Production (Netlify serves frontend): leave as false
    forward-enabled: ${SPA_FORWARD:false}
  jwt:
    secret: ${JWT_SECRET:YXJjYWRpYS1wcmVtaXVtLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9u}
    expiration-ms: 86400000       # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

  # Daily export scheduler
  daily-export:
    recipient-email: ${DAILY_EXPORT_EMAIL:}

  # Gender detection (Python + OpenCV)
  detection:
    python-path: ${PYTHON_PATH:python3}
    script-dir: ${DETECTION_SCRIPT_DIR:}

  # WhatsApp Business API (optional)
  whatsapp:
    enabled: ${WHATSAPP_ENABLED:false}
    api-url: ${WHATSAPP_API_URL:}
    api-token: ${WHATSAPP_API_TOKEN:}

logging:
  level:
    com.arcadia.premium: DEBUG
    org.springframework.security: INFO

# WhatsApp Cloud API configuration
whatsapp:
  api:
    url: ${WHATSAPP_API_URL:https://graph.facebook.com/v25.0}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  access-token: ${WHATSAPP_ACCESS_TOKEN:}
