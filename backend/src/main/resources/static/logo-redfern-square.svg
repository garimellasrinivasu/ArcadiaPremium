<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="rf-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B1A1A"/>
      <stop offset="100%" style="stop-color:#C0392B"/>
    </linearGradient>
    <linearGradient id="rf-accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A017"/>
      <stop offset="100%" style="stop-color:#B8860B"/>
    </linearGradient>
  </defs>

  <!-- Building Icon -->
  <g transform="translate(8, 6)">
    <!-- Main tall building -->
    <rect x="18" y="12" width="24" height="56" rx="1" fill="url(#rf-icon)"/>
    <!-- Left shorter building -->
    <rect x="2" y="28" width="18" height="40" rx="1" fill="#A52A2A" opacity="0.85"/>
    <!-- Right medium building -->
    <rect x="40" y="20" width="18" height="48" rx="1" fill="#C0392B" opacity="0.75"/>
    <!-- Windows on main building -->
    <rect x="23" y="17" width="5" height="4" rx="0.5" fill="#F5D76E" opacity="0.9"/>
    <rect x="32" y="17" width="5" height="4" rx="0.5" fill="#F5D76E" opacity="0.9"/>
    <rect x="23" y="25" width="5" height="4" rx="0.5" fill="#F5D76E" opacity="0.9"/>
    <rect x="32" y="25" width="5" height="4" rx="0.5" fill="#F5D76E" opacity="0.9"/>
    <rect x="23" y="33" width="5" height="4" rx="0.5" fill="#F5D76E" opacity="0.9"/>
    <rect x="32" y="33" width="5" height="4" rx="0.5" fill="#F5D76E" opacity="0.9"/>
    <rect x="23" y="41" width="5" height="4" rx="0.5" fill="#F5D76E" opacity="0.7"/>
    <rect x="32" y="41" width="5" height="4" rx="0.5" fill="#F5D76E" opacity="0.7"/>
    <!-- Windows on left building -->
    <rect x="7" y="33" width="4" height="3.5" rx="0.5" fill="#F5D76E" opacity="0.7"/>
    <rect x="7" y="40" width="4" height="3.5" rx="0.5" fill="#F5D76E" opacity="0.7"/>
    <rect x="7" y="47" width="4" height="3.5" rx="0.5" fill="#F5D76E" opacity="0.7"/>
    <!-- Windows on right building -->
    <rect x="45" y="26" width="4" height="3.5" rx="0.5" fill="#F5D76E" opacity="0.6"/>
    <rect x="45" y="33" width="4" height="3.5" rx="0.5" fill="#F5D76E" opacity="0.6"/>
    <rect x="45" y="40" width="4" height="3.5" rx="0.5" fill="#F5D76E" opacity="0.6"/>
    <!-- Ground line -->
    <line x1="0" y1="68" x2="60" y2="68" stroke="url(#rf-accent)" stroke-width="1.5"/>
    <!-- Antenna/spire on main building -->
    <line x1="30" y1="12" x2="30" y2="4" stroke="#8B1A1A" stroke-width="1.5"/>
    <circle cx="30" cy="3" r="1.5" fill="#D4A017"/>
  </g>

  <!-- PRANEETH text -->
  <text x="80" y="30" font-family="'Playfair Display', 'Georgia', serif" font-size="13" font-weight="600" fill="#D4A017" letter-spacing="3">PRANEETH</text>
  <!-- Decorative line -->
  <line x1="80" y1="37" x2="210" y2="37" stroke="#D4A017" stroke-width="0.5" opacity="0.5"/>
  <!-- REDFERN SQUARE text -->
  <text x="80" y="58" font-family="'Playfair Display', 'Georgia', serif" font-size="22" font-weight="700" fill="#8B1A1A" letter-spacing="1.5">REDFERN SQUARE</text>
</svg>
