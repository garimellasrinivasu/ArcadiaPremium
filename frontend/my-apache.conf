ServerName localhost

# Proxy modules are already enabled in httpd.conf by the Dockerfile.
# Do NOT re-load them here — duplicate LoadModule causes Apache errors.

# Increase proxy timeout for large receipt images and slow operations
ProxyTimeout 120

# Route /api requests to the Spring Boot backend container
ProxyPass /api http://backend:8080/api timeout=120
ProxyPassReverse /api http://backend:8080/api

# SPA routing — serve index.html for any path that doesn't match a real file
FallbackResource /index.html