<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Anubandham</title>
<meta name="theme-color" content="#0E1B2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anubandham">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Noto+Sans:wght@400;600;700;800&family=Noto+Sans+Telugu:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap">
<style>
/* Layout: one app shell — header, scrolling content, bottom picture-nav on phones, side rail on iPad/desktop; red HELP always floating for residents. Dark "temple night" first, pearl light theme second. */
:root{
  --bg:#0C1828; --bg2:#10223A; --surface:#15283F; --surface2:#1C3350; --line:#2A4566;
  --fg:#F7F2E7; --muted:#B9C4D2; --gold:#E6BE5A; --gold2:#C9962E; --on-gold:#1A1405;
  --sos:#E5392B; --sos2:#B5221A; --ok:#3CC48C; --warn:#F2A93B; --bad:#FF6B5E; --info:#5FB8E8;
  --peacock:#1E9A9A; --shadow:0 14px 34px -16px rgba(0,0,0,.7);
  --f-display:"Marcellus","Noto Sans Telugu","Noto Sans Devanagari",Georgia,serif;
  --f-body:"Noto Sans","Noto Sans Telugu","Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#EEF1F6; --bg2:#E3E8F0; --surface:#FFFFFF; --surface2:#F4F6FA; --line:#D3DAE6;
  --fg:#12223A; --muted:#4A5A70; --gold:#8C5D00; --gold2:#B07A10; --on-gold:#FFFFFF;
  --sos:#D3301F; --sos2:#A81F12; --ok:#137A50; --warn:#9A5C00; --bad:#C0291B; --info:#1C6FA3;
  --peacock:#0F7474; --shadow:0 12px 28px -18px rgba(18,34,58,.45); color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#EEF1F6; --bg2:#E3E8F0; --surface:#FFFFFF; --surface2:#F4F6FA; --line:#D3DAE6;
  --fg:#12223A; --muted:#4A5A70; --gold:#8C5D00; --gold2:#B07A10; --on-gold:#FFFFFF;
  --sos:#D3301F; --sos2:#A81F12; --ok:#137A50; --warn:#9A5C00; --bad:#C0291B; --info:#1C6FA3;
  --peacock:#0F7474; --shadow:0 12px 28px -18px rgba(18,34,58,.45); color-scheme:light;
}
html{font-size:18px;-webkit-text-size-adjust:100%}
html.sz2{font-size:21px} html.sz3{font-size:24px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button,a,input,select{touch-action:manipulation}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:12px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:
  radial-gradient(circle at 10px 10px,color-mix(in srgb,var(--gold) 22%,transparent) 1.4px,transparent 1.6px) 0 0/20px 20px,
  linear-gradient(180deg,var(--bg2),var(--bg));
  border-bottom:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));
  padding:.55rem 1rem .6rem}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.55rem;min-width:0;flex:1 1 auto;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.logo{width:2.6rem;height:2.6rem;flex:none;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(from 0deg,var(--gold),var(--gold2),var(--gold));box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.logo svg{width:68%;height:68%}
.bname{font-family:var(--f-display);font-size:1.25rem;line-height:1.05;color:var(--gold);letter-spacing:.02em}
.bsub{font-size:.68rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrls{display:flex;gap:.4rem;align-items:center}
.top-in{display:grid!important;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand icons" "lang lang";row-gap:.45rem}
.brand{grid-area:brand}.c-icons{grid-area:icons}.c-lang{grid-area:lang;justify-content:space-between}
@media (min-width:760px){.top-in{grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"brand lang icons"}.c-lang{gap:.6rem}}
@media (max-width:400px){.bsub{display:none}.seg button{min-width:2.5rem}}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;min-width:2.6rem;height:2.6rem;border-radius:999px;cursor:pointer;font-weight:700;color:var(--muted);padding:0 .5rem}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.seg .a1{font-size:.8rem}.seg .a2{font-size:1rem}.seg .a3{font-size:1.25rem}
.iconbtn{width:3.1rem;height:3.1rem;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.35rem;display:grid;place-items:center}

.body{flex:1;display:flex;max-width:1180px;width:100%;margin:0 auto}
.rail{display:none}
main{flex:1;min-width:0;padding:1rem 1rem 9.5rem}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--bg2) 94%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid color-mix(in srgb,var(--gold) 30%,var(--line));
  padding:.35rem .35rem calc(.35rem + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.nav-in{display:flex;gap:.2rem;width:100%;max-width:760px}
.nb{flex:1;min-width:0;min-height:3.9rem;border:0;background:none;border-radius:1rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem;color:var(--muted);padding:.2rem .1rem}
.nb .ic{font-size:1.65rem;line-height:1;filter:saturate(1.1)}
.nb .lb{font-size:.62rem;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nb[aria-current="page"]{background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold)}
.nb[aria-current="page"] .ic{transform:scale(1.12)}
@media (min-width:900px){
  .nav{display:none}
  .rail{display:flex;flex-direction:column;gap:.4rem;padding:1rem 0 1rem 1rem;position:sticky;top:5.2rem;align-self:flex-start;width:11.5rem;flex:none}
  .rail .nb{flex-direction:row;justify-content:flex-start;gap:.7rem;padding:.6rem .9rem;min-height:3.4rem}
  .rail .nb .lb{font-size:.9rem}
  main{padding:1.2rem 1.2rem 7rem}
}

/* ---------- SOS ---------- */
.sos{position:fixed;z-index:40;right:1rem;bottom:calc(5.2rem + env(safe-area-inset-bottom,0px));width:6.2rem;height:6.2rem;border-radius:50%;border:4px solid color-mix(in srgb,#fff 70%,var(--sos));
  background:radial-gradient(circle at 35% 30%,#FF6A5A,var(--sos) 55%,var(--sos2));color:#fff;cursor:pointer;
  box-shadow:0 0 0 0 rgba(229,57,43,.55),0 12px 26px -8px rgba(160,20,10,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;animation:pulse 2.4s infinite}
.sos .ic{font-size:2rem;line-height:1}
.sos .lb{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,57,43,.5),0 12px 26px -8px rgba(160,20,10,.8)}70%{box-shadow:0 0 0 18px rgba(229,57,43,0),0 12px 26px -8px rgba(160,20,10,.8)}100%{box-shadow:0 0 0 0 rgba(229,57,43,0),0 12px 26px -8px rgba(160,20,10,.8)}}
@media (min-width:900px){.sos{bottom:1.5rem;right:1.5rem;width:7rem;height:7rem}}

/* ---------- common ---------- */
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:1.75rem;line-height:1.15}
h2{font-size:1.3rem;color:var(--gold);display:flex;align-items:center;gap:.5rem}
h2 .ic{font-size:1.5rem}
.stack{display:flex;flex-direction:column;gap:1.1rem}
.sec{display:flex;flex-direction:column;gap:.7rem}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:1.4rem;padding:1rem;box-shadow:var(--shadow)}
.hero{position:relative;overflow:hidden;border-radius:1.6rem;padding:1.2rem;border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));
  background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--peacock) 45%,transparent),transparent 60%),
  radial-gradient(90% 120% at 0% 100%,color-mix(in srgb,var(--gold) 20%,transparent),transparent 60%),var(--surface);box-shadow:var(--shadow)}
.hero .kolam{position:absolute;right:-30px;top:-30px;width:170px;height:170px;opacity:.25;pointer-events:none}
.hello{display:flex;align-items:center;gap:.9rem}
.avatar{width:4.2rem;height:4.2rem;border-radius:50%;display:grid;place-items:center;font-size:2.4rem;flex:none;background:color-mix(in srgb,var(--gold) 22%,var(--surface2));border:2px solid var(--gold)}
.avatar.sm{width:3.2rem;height:3.2rem;font-size:1.8rem}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1000px){.grid.g4w{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{--h:var(--gold);position:relative;min-height:8.2rem;border-radius:1.4rem;border:1px solid color-mix(in srgb,var(--h) 40%,var(--line));cursor:pointer;
  background:linear-gradient(160deg,color-mix(in srgb,var(--h) 26%,var(--surface)),var(--surface) 75%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.45rem;padding:.9rem .6rem;text-align:center;box-shadow:var(--shadow);transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .big{font-size:3rem;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.tile .t{font-weight:800;font-size:.95rem;line-height:1.2}
.tile .s{font-size:.75rem;color:var(--muted);font-weight:600}
.tile .badge{position:absolute;top:.55rem;right:.55rem}
.h-red{--h:#E5392B}.h-gold{--h:#E6BE5A}.h-teal{--h:#1E9A9A}.h-blue{--h:#4C8DF0}.h-green{--h:#3CC48C}.h-purple{--h:#A877E8}.h-pink{--h:#E86FA6}.h-orange{--h:#F2A03B}
.pill{display:inline-flex;align-items:center;gap:.3rem;padding:.2rem .65rem;border-radius:999px;font-size:.75rem;font-weight:800;white-space:nowrap;border:1px solid currentColor}
.p-ok{color:var(--ok)}.p-warn{color:var(--warn)}.p-bad{color:var(--bad)}.p-info{color:var(--info)}.p-gold{color:var(--gold)}
.btn{min-height:3.4rem;border-radius:1rem;border:0;cursor:pointer;font-weight:800;padding:.6rem 1.2rem;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-size:1rem}
.btn .ic{font-size:1.4rem}
.btn-gold{background:linear-gradient(180deg,var(--gold),var(--gold2));color:var(--on-gold)}
.btn-ghost{background:var(--surface2);border:1px solid var(--line)}
.btn-red{background:var(--sos);color:#fff}
.btn-green{background:var(--ok);color:#06180F}
.btn.wide{width:100%}
.row{display:flex;align-items:center;gap:.8rem}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.list{display:flex;flex-direction:column;gap:.6rem}
.item{display:flex;align-items:center;gap:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:1.1rem;padding:.75rem .9rem;min-height:4rem}
.item .eic{font-size:2rem;width:2.6rem;text-align:center;flex:none;line-height:1}
.item.done{opacity:.55}
.item.now{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 30%,transparent)}
.item .tm{font-weight:800;font-variant-numeric:tabular-nums;min-width:4.2rem;color:var(--gold);font-size:.9rem}
.ttl{font-weight:700}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip{min-height:3.1rem;padding:.4rem 1rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:.4rem}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.note{font-size:.78rem;color:var(--muted);display:flex;gap:.5rem;align-items:flex-start}
.note .ic{font-size:1rem}
hr.orn{border:0;height:14px;margin:.2rem 0;background:radial-gradient(circle,var(--gold) 2px,transparent 2.5px) center/18px 14px repeat-x;opacity:.5}

/* vitals */
.vit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
@media (min-width:760px){.vit{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:1.3rem;padding:.9rem;display:flex;flex-direction:column;gap:.35rem;text-align:center;align-items:center}
.vcard .big{font-size:2.4rem;line-height:1}
.vpair{display:grid;grid-template-columns:1fr 1fr;width:100%;gap:.3rem}
.vpair div{background:var(--surface2);border-radius:.8rem;padding:.35rem .2rem}
.vpair b{display:block;font-size:1.15rem;font-variant-numeric:tabular-nums}
.vpair span{font-size:.62rem;color:var(--muted);font-weight:700;display:flex;gap:.2rem;justify-content:center;align-items:center}

/* switches */
.sw{display:flex;align-items:center;gap:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:1.2rem;padding:.8rem .9rem;cursor:pointer;width:100%;text-align:left}
.sw .eic{font-size:2.1rem;flex:none;width:2.7rem;text-align:center}
.tog{flex:none;width:4.4rem;height:2.5rem;border-radius:999px;background:var(--line);position:relative;transition:background .2s}
.tog::after{content:"";position:absolute;top:.25rem;left:.25rem;width:2rem;height:2rem;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .2s}
.sw[aria-checked="true"] .tog{background:var(--ok)}
.sw[aria-checked="true"] .tog::after{transform:translateX(1.9rem)}
.sw.locked{cursor:default}
.sw.locked .tog{background:var(--muted);opacity:.6}

/* overlays */
.ov{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(5,10,18,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);border:1px solid color-mix(in srgb,var(--gold) 45%,var(--line));border-radius:1.6rem;padding:1.2rem;display:flex;flex-direction:column;gap:1rem;box-shadow:0 30px 60px -20px rgba(0,0,0,.8)}
.sheet.alert{border:3px solid var(--sos);background:linear-gradient(180deg,color-mix(in srgb,var(--sos) 22%,var(--surface)),var(--surface) 45%)}
.bigclock{font-size:3.4rem;font-weight:800;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.04em;line-height:1}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
.st{text-align:center;padding:.6rem .3rem;border-radius:1rem;background:var(--surface2);border:1px solid var(--line);opacity:.5}
.st.on{opacity:1;border-color:var(--ok)}
.st .ic{font-size:1.8rem}
.st b{display:block;font-size:.75rem}
.st span{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
.resp{display:flex;align-items:center;gap:.7rem;background:var(--surface2);border-radius:1rem;padding:.6rem .8rem}
.resp .eic{font-size:2.2rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6rem + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--bg);font-weight:800;padding:.85rem 1.3rem;border-radius:999px;box-shadow:var(--shadow);max-width:calc(100% - 2rem);text-align:center;display:flex;gap:.5rem;align-items:center}

/* splash */
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;padding:2rem 1rem;text-align:center;
  background:radial-gradient(80% 60% at 50% 0%,color-mix(in srgb,var(--peacock) 35%,transparent),transparent 70%),
  radial-gradient(circle at 12px 12px,color-mix(in srgb,var(--gold) 16%,transparent) 1.5px,transparent 1.8px) 0 0/24px 24px,var(--bg)}
.splash .logo{width:6rem;height:6rem}
.splash h1{font-size:2.6rem;color:var(--gold);letter-spacing:.03em}
.splash .te-name{font-family:"Noto Sans Telugu",sans-serif;font-size:1.4rem;color:var(--fg);margin-top:-.6rem}
.roles{display:grid;gap:1rem;width:100%;max-width:900px;grid-template-columns:1fr}
@media (min-width:700px){.roles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.role{min-height:11rem}
.role .big{font-size:4rem}
.role .t{font-size:1.15rem}

/* tables / bars */
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th{text-align:left;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;padding:.5rem .4rem;border-bottom:1px solid var(--line)}
.tbl td{padding:.6rem .4rem;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl td.r,.tbl th.r{text-align:right}
.scroll{overflow-x:auto}
.counters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem}
.counter{background:var(--surface);border:1px solid var(--line);border-radius:1.3rem;padding:.9rem .5rem;text-align:center}
.counter .big{font-size:2.2rem}
.counter b{display:block;font-size:2rem;font-variant-numeric:tabular-nums;color:var(--gold);line-height:1.1}
.counter span{font-size:.75rem;font-weight:800;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:.5rem;height:9rem;padding:.4rem .2rem 0;border-bottom:1px solid var(--line);position:relative}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:.25rem}
.bars .b i{display:block;width:100%;max-width:2.6rem;border-radius:.5rem .5rem 0 0;background:linear-gradient(180deg,var(--gold),var(--gold2))}
.bars .b em{font-style:normal;font-size:.68rem;font-weight:800;font-variant-numeric:tabular-nums}
.bars .lim{position:absolute;left:0;right:0;border-top:2px dashed var(--bad)}
.bars .lim span{position:absolute;right:0;top:-1.2rem;font-size:.65rem;font-weight:800;color:var(--bad)}
.blab{display:flex;gap:.5rem}.blab span{flex:1;text-align:center;font-size:.68rem;color:var(--muted);font-weight:700}
.stripe{border-left:6px solid var(--line)}
.stripe.ok{border-left-color:var(--ok)}.stripe.warn{border-left-color:var(--warn)}.stripe.bad{border-left-color:var(--bad)}
.meter{height:.6rem;border-radius:999px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:999px}
.demo-tag{font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:.15rem .6rem}
.two{display:grid;gap:1.1rem;grid-template-columns:1fr}
@media (min-width:900px){.two{grid-template-columns:1fr 1fr}}
.offline{display:flex;align-items:center;gap:.6rem;background:var(--surface2);border:1px dashed var(--line);border-radius:1rem;padding:.6rem .8rem;font-size:.8rem;font-weight:700}
.offline .ic{font-size:1.5rem}
</style>
</head><body>

(function(){

/* ================= i18n ================= */
const T={

 const s=SERVICES.find(x=>x.id===id);
 overlay=sheet(`<div style="text-align:center;font-size:5rem;line-height:1">${s.ic}</div><h1 style="text-align:center">${t(s.id)}</h1>
  <div class="hero row" style="justify-content:center"><span style="font-size:2.4rem">⏱️</span><h1 class="num">${W(s.sla,s.unit)}</h1></div>
  <div class="grid"><button class="btn btn-ghost" data-act="closeOv">✖</button><button class="btn btn-gold" data-act="reqgo" data-id="${s.id}"><span class="ic">✔</span>${t("request")}</button></div>`);
 render();
}
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;overlay="";render();toast("Installed · see your home screen","✅");});
function installEnv(){
 const ua=navigator.userAgent||"";
 const ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
 const android=/Android/.test(ua);
 const safari=ios&&!/CriOS|FxiOS|EdgiOS|GSA|Instagram|FBAN|FBAV|WhatsApp/.test(ua);
 let framed=false;try{framed=window.self!==window.top;}catch(_){framed=true;}
 const standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
 const hostable=location.protocol==="https:"&&!framed&&!/claude\.ai|claudeusercontent/.test(location.hostname)&&!!document.querySelector('link[rel="manifest"]');
 return {ios,android,safari,framed,standalone,hostable};
}
function openInstall(){
 const E=installEnv();let body;
 if(E.standalone){
  body=`<div style="text-align:center;font-size:4.5rem">✅</div><h1 style="text-align:center">Already installed</h1><div class="note" style="justify-content:center">You are using the app from your home screen.</div>`;
 }else if(!E.hostable){
  body=`<div style="text-align:center;font-size:4.5rem">🔗</div><h1 style="text-align:center">Open the app link first</h1>
  <div class="item"><span class="eic">⚠️</span><span class="grow"><span class="ttl">This preview link cannot be installed</span><br><span class="muted small">Previews and files opened from a folder can't be added as an app.</span></span></div>
  <div class="item"><span class="eic">🌐</span><span class="grow"><span class="ttl">Open Anubandham's own web link</span><br><span class="muted small">for example https://anubandham-praneeth.netlify.app, then tap 📲 again</span></span></div>`;
 }else if(deferredPrompt){
  body=`<div style="text-align:center;font-size:4.5rem">📲</div><h1 style="text-align:center">${t("install")}</h1><button class="btn btn-gold wide" data-act="installNow" style="min-height:4.4rem;font-size:1.15rem"><span class="ic">⬇️</span>Install Anubandham</button>`;
 }else if(E.ios&&!E.safari){
  body=`<div style="text-align:center;font-size:4.5rem">🧭</div><h1 style="text-align:center">Open in Safari</h1>
  <div class="item"><span class="eic">1️⃣</span><span class="grow ttl">Tap ⋯ or the share icon → "Open in Safari"</span></div>
  <div class="item"><span class="eic">2️⃣</span><span class="grow ttl">In Safari tap 📲 again</span></div>`;
 }else if(E.ios){
  body=`<h1>📲 ${t("install")}</h1>
  <div class="item"><span class="eic">1️⃣</span><span class="grow"><span class="ttl">Tap Share</span><br><span class="muted small">the square with ⬆️ arrow, bottom of Safari</span></span><span style="font-size:2rem">⬆️</span></div>
  <div class="item"><span class="eic">2️⃣</span><span class="grow"><span class="ttl">Scroll down · Add to Home Screen</span></span><span style="font-size:2rem">➕</span></div>
  <div class="item"><span class="eic">3️⃣</span><span class="grow"><span class="ttl">Tap Add (top right)</span></span><span style="font-size:2rem">✅</span></div>`;
 }else{
  body=`<h1>📲 ${t("install")}</h1>
  <div class="item"><span class="eic">1️⃣</span><span class="grow"><span class="ttl">Open in Chrome</span><br><span class="muted small">not inside WhatsApp's browser</span></span></div>
  <div class="item"><span class="eic">2️⃣</span><span class="grow"><span class="ttl">Tap ⋮ menu (top right)</span></span></div>
  <div class="item"><span class="eic">3️⃣</span><span class="grow"><span class="ttl">Install app / Add to Home screen</span></span></div>`;
 }
 overlay=sheet(body+`<button class="btn btn-ghost wide" data-act="closeOv">OK</button>`);
 render();
}

/* ================= events ================= */
document.addEventListener("click",e=>{
 const el=e.target.closest("[data-act]");if(!el)return;
 if(el.dataset.act==="closeOv"&&e.target.closest("[data-stop]")&&!e.target.closest("button[data-act='closeOv']"))return;
 const a=el.dataset.act,id=el.dataset.id;keepScroll=true;
 switch(a){
  case "role":S.role=id;overlay="";keepScroll=false;window.scrollTo(0,0);break;
  case "switch":S.role=null;overlay="";keepScroll=false;break;
  case "home":S.tab[S.role]=S.role==="resident"?"home":S.role==="family"?"today":"board";keepScroll=false;window.scrollTo(0,0);break;
  case "lang":S.lang=id;break;
  case "size":S.size=+id;break;
  case "theme":S.theme=isDark()?"light":"dark";document.documentElement.setAttribute("data-theme",S.theme);break;
  case "tab":S.tab[S.role]=id;keepScroll=false;window.scrollTo(0,0);break;
  case "sos":S.alert={raised:now(),closed:null};overlay="";try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(_){}break;
  case "closeAlert":if(S.alert)S.alert.closed=now();toast("✔ "+t("resolved"));break;
  case "med":S.meds[id]=!S.meds[id];break;
  case "meal":S.meals[el.dataset.id]=S.meals[el.dataset.id]===el.dataset.v?null:el.dataset.v;if(S.meals[el.dataset.id])toast(t("ordered")+" · "+t(el.dataset.v==="room"?"room":"hall"),el.dataset.v==="room"?"🚪":"🏛️");break;
  case "quick-lunch":S.meals.lunch="room";S.tab.resident="meals";toast(t("ordered")+" · "+t("room")+(S.unwell?" · "+t("free"):" · "+inr(ROOM_FEE)),"🍱");keepScroll=false;window.scrollTo(0,0);break;
  case "unwell":S.unwell=!S.unwell;break;
  case "call":openCall();return;
  case "doctor":overlay=sheet(`<div style="text-align:center;font-size:5rem">👨‍⚕️</div><h1 style="text-align:center">${t("talkDoctor")}</h1><div class="bigclock" data-since="${now()}">00:00</div><div class="note" style="justify-content:center">Connecting to physician panel · median 4 min</div><button class="btn btn-red wide" data-act="closeOv">${t("endCall")}</button>`);break;
  case "req":openReq(id);return;
  case "reqgo":S.requests.push({id,t:now()});overlay="";toast(t("ordered"),"✔");break;
  case "reqdone":{const r=S.requests.find(x=>String(x.t)===id);if(r)r.done=true;break;}
  case "vote":S.votes.v1=id;break;
  case "consent":S.consent[id]=!S.consent[id];S.log.push({t:now(),p:id,v:S.consent[id],lang:S.lang});toast((S.consent[id]?t("on"):t("off"))+" · "+fmtT(now()),S.consent[id]?"🟢":"🔴");break;
  case "export":{const txt=S.log.map(l=>`${new Date(l.t).toISOString()}  ${l.p}  ${l.v?"GRANTED":"WITHDRAWN"}  notice v1.0 (${l.lang})`).join("\n");
   const done=()=>toast(t("copied"),"📋");
   try{navigator.clipboard.writeText(txt).then(done,()=>{overlay=sheet(`<h1>📜</h1><textarea id="exp" style="width:100%;height:14rem;font:inherit;font-size:.7rem">${esc(txt)}</textarea><button class="btn btn-gold" data-act="closeOv">OK</button>`);render();});}catch(_){}
   return;}
  case "copy":try{navigator.clipboard.writeText(id).then(()=>toast(t("copied"),"📋"),()=>toast(id));}catch(_){toast(id);}return;
  case "cur":S.cur=id;break;
  case "pay":overlay=sheet(`<div style="text-align:center;font-size:4rem">🔒</div><h1 style="text-align:center">${t("payNow")}</h1><div class="note" style="justify-content:center">Demo: the licensed payment gateway opens here.</div><button class="btn btn-gold wide" data-act="paydemo">✔ Mark as paid (demo)</button><button class="btn btn-ghost wide" data-act="closeOv">✖</button>`);break;
  case "paydemo":S.paid=true;overlay="";toast(t("paid"),"✅");break;
  case "vdate":S.visit.dates=id;break;
  case "airport":S.visit.airport=!S.visit.airport;break;
  case "book":S.visit.booked=true;toast(t("booked"),"🛏️");break;
  case "unbook":S.visit.booked=false;break;
  case "rdone":{const r=S.roster[+id];r.s="done";r.t=fmtT(now());r.by="Marked by duty desk";break;}
  case "install":openInstall();return;
  case "installNow":if(deferredPrompt){const dp=deferredPrompt;deferredPrompt=null;dp.prompt();dp.userChoice.then(c=>{overlay="";render();if(c.outcome==="accepted")toast("Installed · see your home screen","✅");}).catch(()=>{});}return;
  case "closeOv":overlay="";break;
 }
 render();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&overlay){overlay="";render();}});

/* live clocks */
function tick(){
 document.querySelectorAll("[data-since]").forEach(el=>{el.textContent=mmss(now()-(+el.dataset.since));});
 if(S.role==="resident"&&S.alert&&!S.alert.closed){
  const el=now()-S.alert.raised;
  const d=document.querySelector('[data-step="d"]'),ar=document.querySelector('[data-step="a"]');
  if(d&&el>3000&&!d.classList.contains("on"))render();
  else if(ar&&el>45000&&!ar.classList.contains("on"))render();
 }
}
setInterval(tick,1000);
window.addEventListener("storage",e=>{if(e.key===KEY){try{const n=JSON.parse(e.newValue);const keep={role:S.role,tab:S.tab};S=Object.assign({},defaults,n,keep);render();}catch(_){}}});
render();
})();
</script>

<script>
if("serviceWorker" in navigator){
 addEventListener("load",()=>{
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{
   r.update();
   document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")r.update();});
  }).catch(()=>{});
 });
 let reloaded=false;
 navigator.serviceWorker.addEventListener("controllerchange",()=>{if(reloaded)return;reloaded=true;location.reload();});
}
</script>
</body></html>
