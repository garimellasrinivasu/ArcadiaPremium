<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80">
  <defs>
    <linearGradient id="kv-trunk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5D4037"/>
      <stop offset="100%" style="stop-color:#795548"/>
    </linearGradient>
    <linearGradient id="kv-leaves" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1B5E20"/>
      <stop offset="50%" style="stop-color:#2E7D32"/>
      <stop offset="100%" style="stop-color:#43A047"/>
    </linearGradient>
    <linearGradient id="kv-leaves2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#388E3C"/>
      <stop offset="100%" style="stop-color:#66BB6A"/>
    </linearGradient>
  </defs>

  <!-- Kalpavruksha (Wish-fulfilling Tree) Icon -->
  <g transform="translate(8, 2)">
    <!-- Trunk -->
    <path d="M 28 76 L 24 48 L 36 48 L 32 76 Z" fill="url(#kv-trunk)"/>
    <!-- Root flares -->
    <path d="M 24 72 C 18 74, 14 76, 12 76" stroke="#795548" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 36 72 C 42 74, 46 76, 48 76" stroke="#795548" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Main canopy — layered circles for organic look -->
    <circle cx="30" cy="32" r="18" fill="url(#kv-leaves)"/>
    <circle cx="18" cy="36" r="12" fill="url(#kv-leaves)" opacity="0.9"/>
    <circle cx="42" cy="36" r="12" fill="url(#kv-leaves)" opacity="0.9"/>
    <circle cx="22" cy="24" r="11" fill="url(#kv-leaves2)" opacity="0.85"/>
    <circle cx="38" cy="24" r="11" fill="url(#kv-leaves2)" opacity="0.85"/>
    <circle cx="30" cy="18" r="10" fill="url(#kv-leaves2)" opacity="0.8"/>

    <!-- Highlight leaves -->
    <circle cx="26" cy="28" r="3" fill="#81C784" opacity="0.5"/>
    <circle cx="36" cy="22" r="2.5" fill="#A5D6A7" opacity="0.4"/>
    <circle cx="18" cy="32" r="2" fill="#81C784" opacity="0.4"/>

    <!-- Small golden fruits (wish-fulfilling) -->
    <circle cx="20" cy="38" r="2" fill="#FFD54F"/>
    <circle cx="40" cy="38" r="2" fill="#FFD54F"/>
    <circle cx="30" cy="14" r="2" fill="#FFD54F"/>
    <circle cx="14" cy="30" r="1.5" fill="#FFD54F" opacity="0.8"/>
    <circle cx="46" cy="30" r="1.5" fill="#FFD54F" opacity="0.8"/>
  </g>

  <!-- KALPAVRUKSHA text -->
  <text x="72" y="38" font-family="'Playfair Display', 'Georgia', serif" font-size="24" font-weight="700" fill="#1B5E20" letter-spacing="2">KALPAVRUKSHA</text>
  <!-- Decorative leaf accent line -->
  <line x1="72" y1="45" x2="280" y2="45" stroke="#4CAF50" stroke-width="0.8" opacity="0.4"/>
  <!-- DEVELOPERS text -->
  <text x="74" y="63" font-family="'Montserrat', 'Arial', 'Helvetica', sans-serif" font-size="14" font-weight="600" fill="#2E7D32" letter-spacing="4">DEVELOPERS</text>
</svg>
