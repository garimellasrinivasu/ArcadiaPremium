<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="aa-arrow" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" style="stop-color:#E65100"/>
      <stop offset="40%" style="stop-color:#F57C00"/>
      <stop offset="100%" style="stop-color:#FF9800"/>
    </linearGradient>
    <linearGradient id="aa-arrow-shadow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F57C00"/>
      <stop offset="100%" style="stop-color:#BF360C"/>
    </linearGradient>
  </defs>

  <!-- Stylized "A" Arrow Icon -->
  <g transform="translate(6, 4)">
    <!-- Left face of arrow (darker) -->
    <path d="M 32 4 L 4 42 L 18 42 L 18 72 L 32 72 Z" fill="url(#aa-arrow-shadow)"/>
    <!-- Right face of arrow (brighter) -->
    <path d="M 32 4 L 60 42 L 46 42 L 46 72 L 32 72 Z" fill="url(#aa-arrow)"/>
    <!-- Inner triangle cutout for "A" shape -->
    <path d="M 32 22 L 24 38 L 40 38 Z" fill="white" opacity="0.95"/>
    <!-- Small horizontal bar in "A" -->
    <rect x="22" y="44" width="20" height="3" rx="1" fill="white" opacity="0.25"/>
  </g>

  <!-- AALAYA text -->
  <text x="82" y="40" font-family="'Montserrat', 'Arial Black', 'Helvetica', sans-serif" font-size="34" font-weight="900" fill="#F56600" letter-spacing="4">AALAYA</text>
  <!-- ARVINDHAM text -->
  <text x="84" y="64" font-family="'Montserrat', 'Arial', 'Helvetica', sans-serif" font-size="16" font-weight="600" fill="#F57C00" letter-spacing="2.5">ARVINDHAM</text>
</svg>
