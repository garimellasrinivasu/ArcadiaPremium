services:
  db:
    image: postgres:15-alpine
    container_name: arcadia-db
    restart: always
    environment:
      POSTGRES_DB: arcadia
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - arcadia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d arcadia"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: ghcr.io/garimellasrinivasu/arcadiapremium-backend:main
    container_name: backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      # JVM heap limits — sized for 3.7GB server with large base64 receipt images
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/arcadia
      - SPRING_DATASOURCE_USERNAME=dev_user
      - SPRING_DATASOURCE_PASSWORD=dev_password
      - SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT=30000
      - SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT=5000
      - SPRING_DATASOURCE_HIKARI_MAX_LIFETIME=600000
      - SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME=300000
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=5
      - SPRING_JPA_OPEN_IN_VIEW=false
    ports:
      - "3001:8080"
    networks:
      - arcadia-network
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ 2>/dev/null; exit 0"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 45s

  frontend:
    image: ghcr.io/garimellasrinivasu/arcadiapremium-frontend:main
    container_name: frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - arcadia-network


networks:
  arcadia-network:
    driver: bridge

volumes:
  postgres_data: