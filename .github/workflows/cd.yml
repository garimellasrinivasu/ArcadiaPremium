name: Continuous Delivery

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Java CI with Maven and Docker", "Frontend CI and Docker"]
    types: [completed]

jobs:
  deploy:
    # Run on manual dispatch OR when a CI workflow succeeds
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      # Verify BOTH CI workflows passed before deploying
      - name: Check all CI workflows passed
        id: check_ci
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking that both CI workflows have passed on branch main..."

          # Get latest run for backend CI
          BACKEND_STATUS=$(gh run list --workflow="maven.yml" --branch=main --limit=1 --json conclusion --jq '.[0].conclusion')
          echo "Backend CI status: $BACKEND_STATUS"

          # Get latest run for frontend CI
          FRONTEND_STATUS=$(gh run list --workflow="npm.yml" --branch=main --limit=1 --json conclusion --jq '.[0].conclusion')
          echo "Frontend CI status: $FRONTEND_STATUS"

          if [ "$BACKEND_STATUS" != "success" ] || [ "$FRONTEND_STATUS" != "success" ]; then
            echo "Not all CI workflows have passed yet."
            echo "  Backend: $BACKEND_STATUS"
            echo "  Frontend: $FRONTEND_STATUS"
            echo "Skipping deploy for this trigger (waiting for the other to finish)."
            echo "ready=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Both CI workflows passed. Proceeding with deploy."
          echo "ready=true" >> $GITHUB_OUTPUT

      - name: Copy Docker Compose to Server
        if: steps.check_ci.outputs.ready == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          SSH_OPTS="-o StrictHostKeyChecking=no -i /tmp/deploy_key"
          ssh $SSH_OPTS ${SERVER_USER}@${SERVER_IP} "mkdir -p ~/arcadia-app/scripts"
          scp $SSH_OPTS docker-compose.yml ${SERVER_USER}@${SERVER_IP}:~/arcadia-app/
          scp $SSH_OPTS -r scripts/ ${SERVER_USER}@${SERVER_IP}:~/arcadia-app/
          rm -f /tmp/deploy_key

      - name: Deploy via SSH
        if: steps.check_ci.outputs.ready == 'true' || github.event_name == 'workflow_dispatch'
        uses: appleboy/ssh-action@v1.0.3
        env:
          ZOHO_SMTP_PASSWORD: ${{ secrets.ZOHO_SMTP_PASSWORD }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ZOHO_SMTP_PASSWORD,WHATSAPP_PHONE_NUMBER_ID,WHATSAPP_ACCESS_TOKEN,MAIL_USERNAME,MAIL_PASSWORD
          command_timeout: 5m
          script: |
            set -e

            # Securely inject SMTP password
            echo "export SMTP_PASS=\"$ZOHO_SMTP_PASSWORD\"" > ~/.backup_secrets
            chmod 600 ~/.backup_secrets

            cd ~/arcadia-app

            # Create/update .env with WhatsApp + Gmail credentials from GitHub Secrets
            echo "MAIL_HOST=smtp.gmail.com" > .env
            echo "MAIL_PORT=587" >> .env
            echo "MAIL_USERNAME=${MAIL_USERNAME}" >> .env
            echo "MAIL_PASSWORD=${MAIL_PASSWORD}" >> .env
            echo "WHATSAPP_API_URL=https://graph.facebook.com/v25.0" >> .env
            echo "WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}" >> .env
            echo "WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}" >> .env
            chmod 600 .env

            # Login to registry
            echo "Logging into GHCR..."
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            echo "Pulling latest images..."
            docker compose pull

            # Stop old containers and remove stale networks
            echo "Stopping old containers..."
            docker compose down --remove-orphans 2>/dev/null || true

            # Start containers with the new images
            echo "Starting containers..."
            docker compose up -d

            # Wait and verify containers are running
            echo "Waiting for containers to start..."
            sleep 10
            docker compose ps

            # Cleanup old unused images to save space
            docker image prune -f

            # Make scripts executable
            chmod +x ~/arcadia-app/scripts/*.sh 2>/dev/null || true

            # Ensure the backup directory exists
            mkdir -p ~/arcadia-backups

            # Setup daily backup cron job at 2:00 AM (removes any old backup job first to avoid duplicates)
            (crontab -l 2>/dev/null | grep -v "scripts/backup.sh"; echo "0 2 * * * /bin/bash ~/arcadia-app/scripts/backup.sh >> ~/arcadia-backups/backup.log 2>&1") | crontab -

            echo "Deployment complete!"
